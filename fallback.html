<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圖片反轉故事｜靜態降級版</title><style>body{margin:0;background:#08101f;color:#fff;font:20px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:30px}h1{font-size:2.4rem}.notice{color:#ffd166}section{margin:24px 0;padding:24px;border:3px solid #63d6ee;border-radius:14px;background:#111c31;break-inside:avoid}h2{font-size:1.8rem}strong{color:#ffd166}@media print{body{background:#fff;color:#000}section{background:#fff;border-color:#000;page-break-after:always}.notice,strong{color:#000}}</style></head><body><main><h1>圖片反轉故事｜靜態降級版</h1><p class="notice"><strong>占位劇情，待主創確認。</strong> 若互動版失靈，老師可依序向下捲動，或列印／另存 PDF 後每頁投影。</p><section><h2>1 · 觀察</h2><p>門外發生了什麼？安靜觀察門、紙箱、雨傘與便條的關係。</p></section><section><h2>2 · 線索一</h2><p><strong>門是從裡面鎖上的。</strong> 哪些是事實，哪些是推測？</p></section><section><h2>3 · 線索二</h2><p><strong>紙箱底部是濕的，但走廊地面是乾的。</strong> 每組提出一個能解釋全部線索的反轉。</p></section><section><h2>4 · 占位結局</h2><p>鄰居在雨中撿到受傷的小貓，屋主怕開門驚動牠，請鄰居把臨時貓窩放在門外。便條是寫給準備接貓的救助志願者。</p></section><section><h2>5 · 復盤</h2><p>哪些線索真正支持解釋？分類「可見事實、補充事實、自己添加的假設」。還有別的合理結局嗎？</p></section></main></body></html>
